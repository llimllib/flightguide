# The brands we chart, and how each source names them.
#
# A brand is what a disc is marketed as, which isn't always who approved it
# with the PDGA or who makes it. build_db.py fails on a disc whose brand isn't
# listed here, so a new brand from a source gets decided rather than guessed.
#
# For each brand:
#
#   pdga     the PDGA manufacturer names its discs are approved under. Often a
#            legal or distributor name, and there can be several. Empty if
#            none of its discs are approved.
#   website  the brand's own site, once a source has been read from it
#   colors   [background, text] on the chart. Defaults to Marshall Street's
#            colors for the brand; brands they don't have need their own.
#   lineage  what we know of who makes the brand's discs, or who it's related
#            to. Not shown on the site yet; kept for later. Each entry names the
#            related company, says what we know, and where we know it from.
#            Facts from memory say so and are unverified until checked.

[brands."ABC Discs"]
pdga = ["ABC Discs"]

[brands."Above Ground Level"]
pdga = ["Above Ground Level"]

[brands."Alfa Discs"]
