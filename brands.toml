# Discs Marshall Street files under the wrong brand, as "Brand | Model" as
# they have it, and the brand they belong to, or { brand, model } to rename
# the model too. Their "Other" brand is a
# catch-all for discs from brands they don't carry; each disc here was matched
# to its PDGA approval by name, specs and approval date.
[reassign]
"Other | Andro C" = "Ozone Discs"
"Other | Andro C (Retooled)" = "Ozone Discs"
"Other | Apollo" = "Alfa Discs"
"Other | Cypress" = "Above Ground Level"
"Other | Flying Squirrel" = "ABC Discs"
"Other | Golem" = "Divergent"
"Other | I-One" = "Hyperflite"
"Other | KGB" = "Fly High Discs"
"Other | Kraken" = "Divergent"
"Other | Lawin" = "Divergent"
"Other | Leviathan" = "Divergent"
"Other | Minotaur" = "Divergent"
"Other | Narwhal" = "Divergent"
"Other | Nice!" = "Momentum Disc Golf"
"Other | Pure OG" = "Fly High Discs"
"Other | Stego" = "Reptilian Disc Golf"
"Other | Strike" = "Birdie"
"Other | Tiyanak" = "Divergent"
"Other | Tyrant" = "Reptilian Disc Golf"
"Other | Ultra" = "Birdie"
"Other | Zeal" = "Universal Play"
"Gateway | Air Strike" = "Arsenal Discs"
"Gateway | Morningstar" = "Arsenal Discs"
"Gateway | Scale" = "Reptilian Disc Golf"
"Gateway | Serpent" = "Reptilian Disc Golf"
"Gateway | Black Zombie Chainsaw" = { brand = "Black Zombie Disc Golf", model = "Chainsaw" }
