name: lint

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# only the newest push to a branch matters, so drop runs that are already stale
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # installs the tools pinned in mise.toml, so CI lints with the same
      # oxlint the lint task uses locally
      - uses: jdx/mise-action@v5.0.1
      # oxlint exits 0 on warnings and most of our rules are warnings, so CI
      # has to ask for them to fail the build. -f github annotates the diff
      - run: oxlint --deny-warnings -f github static
