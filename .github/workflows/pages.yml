name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a run in progress finish, so a deploy is never cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # static/data is committed, but rebuilding it here keeps it honest: if it
      # has drifted from discs.db, the site gets the database's version
      - run: python3 build_json.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deploy
        uses: actions/deploy-pages@v4
