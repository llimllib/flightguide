[tools]
python = "3.14"
"github:llimllib/devd" = "latest"
"npm:oxlint" = "latest"

[tasks.dev]
description = "serve the site locally, with caching off"
run = "python dev.py"

[tasks.fetch]
description = "download the latest copy of every source page into sources/"
run = "python fetch.py"

[tasks.build]
description = "rebuild discs.db from the pages in sources/, then the JSON the site loads"
run = ["python build_db.py", "python build_json.py"]

[tasks.update]
description = "fetch every source and rebuild everything from it"
run = ["python fetch.py", "python build_db.py", "python build_json.py"]

[tasks.json]
description = "rebuild static/data from discs.db"
run = "python build_json.py"

[tasks.lint]
description = "lint the javascript code"
run = "oxlint static"
